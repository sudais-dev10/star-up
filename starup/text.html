
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Star Up | Portfolio Website</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS File -->
    <link rel="stylesheet" href="test1.css">
</head>

<body>

    <!-- Header -->
    <header>
        <a href="#home" class="logo">Star Up</a>

        <nav aria-label="Main navigation">
            <a href="#home" class="active">Home</a>
            <a href="#services">Services</a>
            <a href="#skills">Skills</a>
            <a href="#education">Education</a>
            <a href="#experience">Experience</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Home Section -->
    <section class="home" id="home">

        <!-- Profile Image -->
        <div class="home-img">
              <img src="../images/login.png" alt="Profile Image">
        </div>

        <!-- Home Content -->
        <div class="home-content">

            <h1>Hi, it's <span>Star Up</span></h1>

            <h3 class="typing-text">
                I'm <span></span>
            </h3>

            <p>
                I'm a creative developer focused on building modern,
                responsive websites and beautiful digital experiences.
                I enjoy turning ideas into clean and functional designs.
            </p>

            <!-- Social Media Icons -->
            <div class="social-icons">

                <a href="https://www.facebook.com/"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Facebook">
                    <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
                </a>

                <a href="https://www.instagram.com/"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Instagram">
                    <i class="fa-brands fa-instagram" aria-hidden="true"></i>
                </a>

                <a href="https://github.com/"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="GitHub">
                    <i class="fa-brands fa-github" aria-hidden="true"></i>
                </a>

            </div>

            <!-- Button -->
            <a href="#contact" class="btn">Hire me</a>

        </div>
    </section>

</body>
</html>
